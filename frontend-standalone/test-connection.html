<!DOCTYPE html>
<html>
<head>
    <title>Test Connexion Spring Boot</title>
    <style>
        body { font-family: Arial; padding: 40px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
        #result { margin-top: 20px; padding: 20px; border: 2px solid #ddd; }
    </style>
</head>
<body>
    <h1>🔧 Test de Connexion au Backend Spring Boot</h1>
    <p>Cliquez sur le bouton pour vérifier si le backend Spring Boot répond.</p>
    <button onclick="testConnection()">Tester la Connexion</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Test en cours...</p>';
            
            try {
                // Test: API models
                const response = await fetch('http://localhost:8080/api/detection/models');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3 style="color: green;">✓ CONNEXION RÉUSSIE!</h3>
                    <p><strong>Backend Spring Boot connecté sur port 8080</strong></p>
                    <p>Modèles disponibles: <code>${JSON.stringify(data)}</code></p>
                    <hr>
                    <p>✅ Vous pouvez maintenant utiliser index-ar.html</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 style="color: red;">✗ ERREUR DE CONNEXION</h3>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p><strong>Vérifiez que:</strong></p>
                    <ul>
                        <li>✅ Spring Boot backend tourne sur http://localhost:8080</li>
                        <li>✅ CORS est activé dans le backend</li>
                        <li>✅ Lancez: <code>cd backend && mvn spring-boot:run</code></li>
                    </ul>
                    <p><strong>Ou utilisez:</strong> START-SPRING-AR.bat pour tout démarrer automatiquement</p>
                `;
            }
        }
    </script>
</body>
</html>
