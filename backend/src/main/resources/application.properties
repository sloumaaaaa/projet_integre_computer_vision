# Server Configuration
server.port=8081
spring.application.name=animal-detection-api

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Upload Directory
app.upload.dir=../uploads
app.python.script.dir=../

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:8000,file://,null

# Logging
logging.level.root=INFO
logging.level.com.esprit.animaldetection=DEBUG
