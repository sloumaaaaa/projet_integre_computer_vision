<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animal Detection Web App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .container { max-width: 600px; margin-top: 40px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 32px; }
        .form-label { margin-top: 12px; }
        .result-img { max-width: 100%; border-radius: 8px; margin-top: 16px; }
        .metrics-list { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">🐾 Animal Detection Web App</h1>
        <form method="POST" action="/upload" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
                <label for="image" class="form-label">Select an image:</label>
                <input type="file" class="form-control" name="image" id="image" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label for="threshold" class="form-label">Detection Threshold (0-1):</label>
                <input type="number" step="0.01" min="0" max="1" class="form-control" name="threshold" id="threshold" value="0.5" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Upload and Detect</button>
        </form>

        {% if result_url %}
            <h2 class="mt-4">Result</h2>
            <img src="{{ result_url }}" alt="Annotated Result" class="result-img">
        {% endif %}

        {% if metrics %}
            <div class="metrics-list">
                <h3>Evaluation Metrics</h3>
                <ul class="list-group">
                    {% for key, value in metrics.items() %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><strong>{{ key }}</strong></span>
                            <span>{{ value }}</span>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
