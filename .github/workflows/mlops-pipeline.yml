name: MLOps - Train and Track Model

on:
  push:
    branches: [ main, develop, feature/mlops ]
    paths:
      - 'data/**'
      - 'data_yolo/**'
      - 'mlops/**'
      - 'yolov8_train_eval.py'
      - '.github/workflows/mlops-pipeline.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '1'
      batch_size:
        description: 'Batch size'
        required: false
        default: '16'

jobs:
  train-and-track:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r mlops/requirements.txt
        pip install pytest pytest-cov
    
    - name: 🏋️ Train model with MLflow
      env:
        MLFLOW_TRACKING_URI: sqlite:///./mlflow.db
      run: |
        cd mlops
        python train_with_mlflow.py \
          --epochs ${{ github.event.inputs.epochs || '1' }} \
          --batch ${{ github.event.inputs.batch_size || '16' }} \
          --model yolov8n.pt \
          --project $PWD/../output \
          --name yolov8_ci_run
    
    - name: 🔍 Locate training results
      run: |
        echo "📂 Searching for training output..."
        find . -name "yolov8_ci_run" -type d 2>/dev/null || true
        echo "📂 Searching for results.csv..."
        find . -name "results.csv" 2>/dev/null || true
    
    - name: 📈 Extract metrics
      id: metrics
      run: |
        # Search for results.csv anywhere
        RESULTS_FILE=$(find . -name "results.csv" -path "*/yolov8_ci_run/*" 2>/dev/null | head -n 1)
        
        if [ -z "$RESULTS_FILE" ]; then
          echo "⚠️ No results.csv found in yolov8_ci_run directory"
          # Try to find any results.csv as fallback
          RESULTS_FILE=$(find . -name "results.csv" 2>/dev/null | head -n 1)
        fi
        
        if [ -n "$RESULTS_FILE" ] && [ -f "$RESULTS_FILE" ]; then
          echo "✅ Results found at: $RESULTS_FILE"
          FINAL_MAP=$(tail -n 1 "$RESULTS_FILE" | cut -d',' -f8)
          echo "map50=$FINAL_MAP" >> $GITHUB_OUTPUT
          echo "✅ Final mAP50: $FINAL_MAP"
        else
          echo "⚠️ No results.csv found anywhere - training may have failed"
          echo "map50=0.0" >> $GITHUB_OUTPUT
        fi
    
    - name: 💾 Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          output/**/weights/best.pt
          output/**/results.csv
          output/**/*.png
          mlops/runs/detect/**/weights/best.pt
          mlops/runs/detect/**/results.csv
        retention-days: 30
        if-no-files-found: warn
    
    - name: 📊 Upload MLflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-tracking
        path: |
          mlops/mlflow.db
          mlops/mlruns/
        retention-days: 30
        if-no-files-found: warn
    
    - name: 📝 Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const map50 = '${{ steps.metrics.outputs.map50 }}';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🤖 ML Model Training Results\n\n✅ Training completed successfully!\n\n**Metrics:**\n- mAP50: ${map50}\n- Epochs: ${{ github.event.inputs.epochs || '50' }}\n- Batch Size: ${{ github.event.inputs.batch_size || '16' }}\n\n[View Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
          })
    
    - name: ✅ Validate model performance
      run: |
        # Find the results file
        RESULTS_FILE=$(find . -name "results.csv" -path "*/yolov8_ci_run/*" | head -n 1)
        
        if [ -z "$RESULTS_FILE" ]; then
          echo "⚠️ No results.csv found, skipping validation"
          exit 0
        fi
        
        echo "📊 Found results at: $RESULTS_FILE"
        
        python -c "
        import pandas as pd
        import sys
        df = pd.read_csv('$RESULTS_FILE')
        final_map = df.iloc[-1]['metrics/mAP50(B)']
        print(f'Final mAP50: {final_map}')
        if final_map < 0.3:
            print('⚠️ Warning: Model performance below threshold')
            sys.exit(1)
        else:
            print('✅ Model performance acceptable')
        "
