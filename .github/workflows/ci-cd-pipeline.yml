name: Complete CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install linting tools
        run: |
          pip install flake8 black isort
      
      - name: 🔍 Run flake8
        run: |
          flake8 mlops/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 mlops/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: 🎨 Check code formatting
        run: |
          black --check mlops/
          isort --check-only mlops/

  backend-build:
    name: 🏗️ Build Backend
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
      - uses: actions/checkout@v3
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🔨 Build
        run: |
          cd backend
          mvn clean package -DskipTests
      
      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  ml-training:
    name: 🤖 ML Model Training
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
      - uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: pip install -r mlops/requirements.txt
      
      - name: 🏋️ Train model
        run: |
          cd mlops
          python train_with_mlflow.py --epochs 10 --batch 8 --name ci_test
      
      - name: 📊 Upload training results
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: output/ci_test/

  model-registry:
    name: 📚 Register Model
    runs-on: ubuntu-latest
    needs: ml-training
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install MLflow
        run: pip install mlflow
      
      - name: 📥 Download training artifacts
        uses: actions/download-artifact@v4
        with:
          name: training-results
          path: output/ci_test/
      
      - name: 📝 List registered models
        run: |
          cd mlops
          python register_model.py --action list

  integration-test:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-build, ml-training]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: animal_detection_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: 📦 Install Python dependencies
        run: pip install -r mlops/requirements.txt
      
      - name: 📥 Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/
      
      - name: 🚀 Start backend
        run: |
          cd backend
          java -jar target/*.jar &
          sleep 30
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/animal_detection_app
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 123456
      
      - name: 🧪 Run integration tests
        run: |
          curl -f http://localhost:8081/actuator/health || exit 1
          echo "✅ Backend is healthy"

  deploy-notification:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [backend-build, ml-training, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📬 Send notification
        run: |
          echo "🎉 Deployment successful!"
          echo "✅ Backend built and tested"
          echo "✅ ML model trained and tracked"
          echo "✅ Integration tests passed"
          echo "🚀 Ready for production deployment"
