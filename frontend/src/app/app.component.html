<div class="container-custom">
  <h1 class="mb-4 text-center">🐾 Animal Detection Web App</h1>
  
  <div class="card">
    <div class="card-body">
      <form (ngSubmit)="onSubmit()">
        <!-- File Selection -->
        <div class="mb-3">
          <label for="fileInput" class="form-label">Select an image or video:</label>
          <input 
            type="file" 
            class="form-control" 
            id="fileInput"
            (change)="onFileSelected($event)"
            accept="image/*,video/*"
            [disabled]="loading">
          <small class="form-text text-muted" *ngIf="selectedFile">
            Selected: {{ selectedFile.name }}
          </small>
        </div>

        <!-- Model Selection -->
        <div class="mb-3">
          <label for="modelSelect" class="form-label">Select Model:</label>
          <select 
            class="form-select" 
            id="modelSelect"
            [(ngModel)]="modelType"
            name="modelType"
            [disabled]="loading">
            <option *ngFor="let model of availableModels" [value]="model">
              {{ model | titlecase }}
            </option>
          </select>
        </div>

        <!-- Threshold -->
        <div class="mb-3">
          <label for="thresholdInput" class="form-label">
            Detection Threshold: {{ threshold }}
          </label>
          <input 
            type="range" 
            class="form-range" 
            id="thresholdInput"
            [(ngModel)]="threshold"
            name="threshold"
            min="0"
            max="1"
            step="0.05"
            [disabled]="loading">
          <small class="form-text text-muted">
            Adjust the confidence threshold (0.0 - 1.0)
          </small>
        </div>

        <!-- Show Descriptions -->
        <div class="form-check mb-3">
          <input 
            class="form-check-input" 
            type="checkbox" 
            id="descriptionsCheck"
            [(ngModel)]="showDescriptions"
            name="showDescriptions"
            [disabled]="loading">
          <label class="form-check-label" for="descriptionsCheck">
            Show class descriptions
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary w-100"
          [disabled]="!selectedFile || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ loading ? 'Processing...' : 'Upload and Detect' }}
        </button>
      </form>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="alert alert-danger mt-3" role="alert">
    {{ error }}
  </div>

  <!-- Results -->
  <div *ngIf="result && result.status === 'success'" class="mt-4">
    <!-- Annotated Image -->
    <div class="card mb-3">
      <div class="card-header">
        <h5 class="mb-0">Detection Result</h5>
      </div>
      <div class="card-body text-center">
        <img 
          [src]="getImageUrl(result.annotatedImageUrl)" 
          alt="Annotated Result" 
          class="result-img">
      </div>
    </div>

    <!-- Metrics -->
    <div *ngIf="result.metrics" class="card mb-3 metrics-card">
      <div class="card-header">
        <h5 class="mb-0">Evaluation Metrics</h5>
      </div>
      <div class="card-body">
        <ul class="list-group list-group-flush">
          <li 
            *ngFor="let metric of getMetricsArray()" 
            class="list-group-item d-flex justify-content-between align-items-center">
            <strong>{{ metric.key }}</strong>
            <span class="badge bg-primary rounded-pill">{{ metric.value }}</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Descriptions -->
    <div *ngIf="result.descriptions && getDescriptionsArray().length > 0" class="card mb-3">
      <div class="card-header">
        <h5 class="mb-0">Class Descriptions</h5>
      </div>
      <div class="card-body">
        <div *ngFor="let desc of getDescriptionsArray()" class="mb-3">
          <h6 class="text-primary">{{ desc.key }}</h6>
          <p class="text-muted mb-0">{{ desc.value }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
